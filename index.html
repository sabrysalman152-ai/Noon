<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOOR | نُور – القرآن الكريم والتطبيق الإسلامي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Amiri Quran & IBM Plex Sans Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            950: '#022c22',
                            900: '#064e3b',
                            800: '#065f46',
                            700: '#047857',
                        },
                        gold: {
                            600: '#b45309',
                            500: '#d97706',
                            400: '#d4af37',
                            300: '#fcd34d',
                        },
                        obsidian: {
                            950: '#0a0f0d',
                            900: '#111916',
                        },
                        ivory: {
                            50: '#fdfcf8',
                        }
                    },
                    fontFamily: {
                        sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
                        quran: ['"Amiri Quran"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }
        .font-quran {
            font-family: 'Amiri Quran', serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-ivory-50 dark:bg-obsidian-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // القراء المعتمدون
        const RECITERS = [
            { id: 7, name: "مشاري راشد العفاسي" },
            { id: 3, name: "عبد الرحمن السديس" },
            { id: 6, name: "ماهر المعيقلي" },
            { id: 2, name: "عبد الباسط عبد الصمد" },
            { id: 9, name: "محمد صديق المنشاوي" },
            { id: 10, name: "سعود الشريم" },
            { id: 11, name: "ياسر الدوسري" }
        ];

        // التفاسير المعتمدة
        const TAFSIRS = [
            { id: 16, name: "التفسير الميسر (مجمع الملك فهد)" },
            { id: 14, name: "تفسير ابن كثير" },
            { id: 91, name: "تفسير السعدي" }
        ];

        function App() {
            const [currentTab, setCurrentTab] = useState('home'); // home, quran, hifz, adhkar, prayer
            const [darkMode, setDarkMode] = useState(false);
            const [surahs, setSurahs] = useState([]);
            const [selectedSurah, setSelectedSurah] = useState(null);
            const [verses, setVerses] = useState([]);
            const [loadingVerses, setLoadingVerses] = useState(false);
            const [fontSize, setFontSize] = useState(30);
            const [selectedTafsirId, setSelectedTafsirId] = useState(16);
            
            // Audio State
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentAudioUrl, setCurrentAudioUrl] = useState(null);
            const [currentAudioTitle, setCurrentAudioTitle] = useState('');
            const [currentReciterId, setCurrentReciterId] = useState(7);
            const [repeatCount, setRepeatCount] = useState(1);
            const [currentRepeat, setCurrentRepeat] = useState(1);
            const [playbackRate, setPlaybackRate] = useState(1);
            
            // Tafsir Drawer
            const [activeTafsirVerse, setActiveTafsirVerse] = useState(null);
            const [tafsirText, setTafsirText] = useState('');
            const [loadingTafsir, setLoadingTafsir] = useState(false);

            // Bookmarks & Hifz
            const [bookmarks, setBookmarks] = useState([]);
            const [lastRead, setLastRead] = useState({ surahId: 1, surahName: "الفاتحة", verseNumber: 1 });
            const [tasbihCount, setTasbihCount] = useState(0);

            const audioRef = useRef(null);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Fetch Surahs list on mount
            useEffect(() => {
                fetch('https://api.quran.com/api/v4/chapters?language=ar')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.chapters) {
                            setSurahs(data.chapters);
                        }
                    })
                    .catch(err => console.error("Error fetching surahs:", err));
            }, []);

            // Fetch Verses when a Surah is selected
            useEffect(() => {
                if (!selectedSurah) return;
                setLoadingVerses(true);
                fetch(`https://api.quran.com/api/v4/verses/by_chapter/${selectedSurah.id}?language=ar&audio=${currentReciterId}&fields=text_uthmani,page_number&per_page=300`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.verses) {
                            setVerses(data.verses);
                        }
                        setLoadingVerses(false);
                    })
                    .catch(err => {
                        console.error("Error fetching verses:", err);
                        setLoadingVerses(false);
                    });
            }, [selectedSurah, currentReciterId]);

            // Audio Playback Handler
            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.playbackRate = playbackRate;
                    if (isPlaying && currentAudioUrl) {
                        audioRef.current.play().catch(e => console.log("Audio play error:", e));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentAudioUrl, playbackRate]);

            const playAudio = (url, title) => {
                setCurrentAudioUrl(url);
                setCurrentAudioTitle(title);
                setIsPlaying(true);
                setCurrentRepeat(1);
            };

            const handleAudioEnded = () => {
                if (currentRepeat < repeatCount) {
                    setCurrentRepeat(prev => prev + 1);
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play();
                    }
                } else {
                    setIsPlaying(false);
                    setCurrentRepeat(1);
                }
            };

            const fetchTafsir = (verseKey) => {
                setActiveTafsirVerse(verseKey);
                setLoadingTafsir(true);
                fetch(`https://api.quran.com/api/v4/tafsirs/${selectedTafsirId}/by_ayah/${verseKey}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.tafsir) {
                            setTafsirText(data.tafsir.text);
                        }
                        setLoadingTafsir(false);
                    })
                    .catch(err => {
                        console.error("Error fetching tafsir:", err);
                        setLoadingTafsir(false);
                    });
            };

            const toggleBookmark = (verseKey, surahName, verseNumber, text) => {
                setBookmarks(prev => {
                    const exists = prev.some(b => b.verseKey === verseKey);
                    if (exists) {
                        return prev.filter(b => b.verseKey !== verseKey);
                    } else {
                        return [...prev, { verseKey, surahName, verseNumber, text }];
                    }
                });
            };

            return (
                <div className="min-h-screen flex flex-col bg-ivory-50 dark:bg-obsidian-950 text-gray-800 dark:text-gray-100 pb-32">
                    {/* Navbar */}
                    <header className="sticky top-0 z-40 bg-white/90 dark:bg-obsidian-900/90 backdrop-blur-md border-b border-emerald-100 dark:border-emerald-900/40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentTab('home')}>
                                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-800 to-emerald-950 flex items-center justify-center text-gold-400 shadow-lg">
                                    <i data-lucide="book-open" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-emerald-900 to-emerald-700 dark:from-gold-400 dark:to-gold-300 bg-clip-text text-transparent">نُور</h1>
                                    <p className="text-xs text-gray-500 dark:text-gray-400">القرآن الكريم والتطبيق الإسلامي</p>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-1">
                                {[
                                    { id: 'home', label: 'الرئيسية', icon: 'home' },
                                    { id: 'quran', label: 'المصحف', icon: 'book-open' },
                                    { id: 'hifz', label: 'الحفظ والمراجعة', icon: 'bookmark' },
                                    { id: 'adhkar', label: 'الأذكار والأسماء', icon: 'sparkles' },
                                    { id: 'prayer', label: 'الصلاة والقبلة', icon: 'compass' }
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentTab(item.id)}
                                        className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all ${
                                            currentTab === item.id 
                                                ? 'bg-emerald-900 text-gold-300 shadow-md shadow-emerald-900/20' 
                                                : 'hover:bg-emerald-50 dark:hover:bg-emerald-950/50 text-gray-600 dark:text-gray-300'
                                        }`}
                                    >
                                        <i data-lucide={item.icon} className="w-4 h-4"></i>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center gap-3">
                                <span className="text-xs px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-gold-400 font-bold border border-emerald-200 dark:border-emerald-800 flex items-center gap-1">
                                    <i data-lucide="bookmark" className="w-3.5 h-3.5 text-gold-500 fill-gold-500"></i>
                                    <span>{bookmarks.length}</span>
                                </span>
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2.5 rounded-xl bg-gray-100 dark:bg-obsidian-950 text-gray-700 dark:text-gold-400 hover:bg-emerald-100 dark:hover:bg-emerald-900/40 transition-colors border border-gray-200 dark:border-emerald-900/50"
                                >
                                    <i data-lucide={darkMode ? "sun" : "moon"} className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Mobile Navigation Bar */}
                    <div className="md:hidden fixed top-20 left-0 right-0 z-30 bg-white/95 dark:bg-obsidian-900/95 border-b border-gray-200 dark:border-obsidian-950 flex justify-around p-2 shadow-md">
                        {[
                            { id: 'home', label: 'الرئيسية', icon: 'home' },
                            { id: 'quran', label: 'المصحف', icon: 'book-open' },
                            { id: 'hifz', label: 'الحفظ', icon: 'bookmark' },
                            { id: 'adhkar', label: 'الأذكار', icon: 'sparkles' },
                            { id: 'prayer', label: 'الصلاة', icon: 'compass' }
                        ].map(item => (
                            <button
                                key={item.id}
                                onClick={() => setCurrentTab(item.id)}
                                className={`flex flex-col items-center p-2 rounded-xl text-xs font-medium ${
                                    currentTab === item.id ? 'text-emerald-800 dark:text-gold-400 font-bold bg-emerald-50 dark:bg-emerald-950' : 'text-gray-500'
                                }`}
                            >
                                <i data-lucide={item.icon} className="w-5 h-5 mb-1"></i>
                                {item.label}
                            </button>
                        ))}
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 mt-14 md:mt-0">
                        {currentTab === 'home' && (
                            <div className="space-y-10">
                                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-900 via-emerald-800 to-emerald-950 p-8 sm:p-12 text-white shadow-2xl border border-gold-500/30">
                                    <div className="relative z-10 max-w-2xl space-y-4">
                                        <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-gold-500/20 border border-gold-500/40 text-gold-300 text-xs font-semibold">
                                            <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                            <span>منصة نُور الإسلامية المتكاملة</span>
                                        </div>
                                        <h2 className="text-3xl sm:text-5xl font-extrabold tracking-tight">اقرأ ورتل القرآن الكريم <span className="text-gold-400">بخشوع وسكينة</span></h2>
                                        <p className="text-emerald-100/80 text-sm sm:text-base leading-relaxed">المصحف الشريف بالرسم العثماني، تفاسير معتمدة، تلاوات لأشهر القراء، ونظام ذكي للمراجعة والحفظ.</p>
                                        <div className="pt-2">
                                            <button
                                                onClick={() => {
                                                    if (surahs.length > 0) {
                                                        setSelectedSurah(surahs[0]);
                                                        setCurrentTab('quran');
                                                    }
                                                }}
                                                className="inline-flex items-center gap-3 px-6 py-3.5 rounded-2xl bg-gradient-to-r from-gold-500 to-gold-600 text-emerald-950 font-bold shadow-lg hover:scale-105 transition-transform"
                                            >
                                                <i data-lucide="book-open" className="w-5 h-5"></i>
                                                <span>ابدأ القراءة الآن</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Quick Shortcuts */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6">
                                    {[
                                        { title: 'المصحف الشريف', desc: 'تصفح السور الـ114', icon: 'book-open', tab: 'quran' },
                                        { title: 'نظام الحفظ', desc: 'خطط لمتابعة حفظك', icon: 'bookmark', tab: 'hifz' },
                                        { title: 'الأذكار والسبحة', desc: 'أذكار الصباح والمساء', icon: 'sparkles', tab: 'adhkar' },
                                        { title: 'مواقيت الصلاة', desc: 'أوقات الصلوات والقبلة', icon: 'compass', tab: 'prayer' }
                                    ].map((item, idx) => (
                                        <div
                                            key={idx}
                                            onClick={() => setCurrentTab(item.tab)}
                                            className="p-6 rounded-2xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900/40 shadow-md hover:shadow-xl hover:border-gold-500/50 transition-all cursor-pointer group"
                                        >
                                            <div className="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-gold-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                                <i data-lucide={item.icon} className="w-6 h-6"></i>
                                            </div>
                                            <h3 className="font-bold text-lg mb-1">{item.title}</h3>
                                            <p className="text-xs text-gray-500 dark:text-gray-400">{item.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                {/* Surah Index List */}
                                <div className="space-y-6">
                                    <h3 className="text-2xl font-bold flex items-center gap-2">
                                        <i data-lucide="star" className="w-6 h-6 text-gold-500"></i>
                                        <span>فهرس السور</span>
                                    </h3>
                                    {surahs.length === 0 ? (
                                        <div className="text-center py-12">
                                            <div className="inline-block w-8 h-8 border-4 border-gold-500 border-t-transparent rounded-full animate-spin"></div>
                                            <p className="mt-2 text-gray-500">جاري تحميل الفهرس...</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {surahs.map(surah => (
                                                <div
                                                    key={surah.id}
                                                    onClick={() => {
                                                        setSelectedSurah(surah);
                                                        setCurrentTab('quran');
                                                    }}
                                                    className="p-5 rounded-2xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900/40 shadow-sm hover:shadow-md hover:border-gold-500 transition-all flex items-center justify-between cursor-pointer group"
                                                >
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-gold-400 font-bold flex items-center justify-center border border-emerald-200 dark:border-emerald-800 group-hover:bg-gold-500 group-hover:text-emerald-950 transition-colors">
                                                            {surah.id}
                                                        </div>
                                                        <div>
                                                            <h4 className="font-bold text-base group-hover:text-emerald-700 dark:group-hover:text-gold-400 transition-colors">{surah.name_arabic}</h4>
                                                            <p className="text-xs text-gray-500 dark:text-gray-400">
                                                                {surah.revelation_place === 'makkah' ? 'مكية' : 'مدنية'} • {surah.verses_count} آيات
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {currentTab === 'quran' && (
                            <div className="space-y-6">
                                {/* Surah Selection & Controls */}
                                <div className="sticky top-20 z-20 bg-white/95 dark:bg-obsidian-900/95 backdrop-blur-md p-4 rounded-2xl shadow-md border border-emerald-100 dark:border-emerald-900/50 flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <span className="font-bold text-sm">اختر السورة:</span>
                                        <select
                                            value={selectedSurah ? selectedSurah.id : 1}
                                            onChange={e => {
                                                const s = surahs.find(item => item.id === Number(e.target.value));
                                                if (s) setSelectedSurah(s);
                                            }}
                                            className="bg-gray-100 dark:bg-obsidian-950 border border-emerald-200 dark:border-emerald-800 rounded-xl px-3 py-2 text-sm font-semibold text-emerald-900 dark:text-gold-300 focus:outline-none"
                                        >
                                            {surahs.map(s => (
                                                <option key={s.id} value={s.id}>{s.id}. {s.name_arabic} ({s.verses_count} آية)</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold">حجم الخط:</span>
                                            <button onClick={() => setFontSize(Math.max(22, fontSize - 2))} className="p-1.5 rounded-lg bg-gray-100 dark:bg-obsidian-950 text-emerald-800 dark:text-gold-400">
                                                <i data-lucide="zoom-out" className="w-4 h-4"></i>
                                            </button>
                                            <span className="text-xs font-semibold">{fontSize}px</span>
                                            <button onClick={() => setFontSize(Math.min(48, fontSize + 2))} className="p-1.5 rounded-lg bg-gray-100 dark:bg-obsidian-950 text-emerald-800 dark:text-gold-400">
                                                <i data-lucide="zoom-in" className="w-4 h-4"></i>
                                            </button>
                                        </div>

                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold">التفسير:</span>
                                            <select
                                                value={selectedTafsirId}
                                                onChange={e => setSelectedTafsirId(Number(e.target.value))}
                                                className="bg-gray-100 dark:bg-obsidian-950 border border-emerald-200 dark:border-emerald-800 rounded-xl px-3 py-1.5 text-xs font-semibold text-emerald-900 dark:text-gold-300 focus:outline-none"
                                            >
                                                {TAFSIRS.map(t => (
                                                    <option key={t.id} value={t.id}>{t.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {/* Verses Display */}
                                {loadingVerses ? (
                                    <div className="text-center py-24 space-y-4">
                                        <div className="inline-block w-10 h-10 border-4 border-gold-500 border-t-transparent rounded-full animate-spin"></div>
                                        <p className="text-gray-500 font-medium">جاري تحميل الآيات بالرسم العثماني...</p>
                                    </div>
                                ) : (
                                    <div className="bg-white dark:bg-obsidian-900 p-8 sm:p-12 rounded-3xl shadow-xl border border-emerald-100 dark:border-emerald-900/40 space-y-8">
                                        <div className="text-center pb-6 border-b border-gray-100 dark:border-obsidian-950">
                                            <h3 className="text-2xl font-bold text-emerald-900 dark:text-gold-400">سورة {selectedSurah ? selectedSurah.name_arabic : 'الفاتحة'}</h3>
                                            <p className="text-xs text-gray-500 mt-1">{selectedSurah?.revelation_place === 'makkah' ? 'مكية' : 'مدنية'} • عدد الآيات: {selectedSurah?.verses_count}</p>
                                            {selectedSurah?.id !== 9 && (
                                                <div className="mt-6 text-xl font-quran text-emerald-800 dark:text-gold-300">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                                            )}
                                        </div>

                                        <div className="space-y-6 text-right leading-loose">
                                            {verses.map(verse => {
                                                const isBookmarked = bookmarks.some(b => b.verseKey === verse.verse_key);
                                                const audioUrl = `https://verses.quran.com/Alafasy/mp3/${verse.verse_key.replace(':', '_')}.mp3`; // Fallback audio URL pattern or direct API

                                                return (
                                                    <div key={verse.id} className="p-6 rounded-2xl bg-gray-50/50 dark:bg-obsidian-950/50 border border-gray-100 dark:border-obsidian-900 hover:border-emerald-200 dark:hover:border-emerald-900 transition-all">
                                                        <p style={{ fontSize: `${fontSize}px` }} className="font-quran leading-loose text-emerald-950 dark:text-ivory-50 text-right">
                                                            {verse.text_uthmani}
                                                            <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-gold-500/25 text-gold-600 dark:text-gold-400 text-sm font-sans mx-2 border border-gold-500/40">
                                                                {verse.verse_number}
                                                            </span>
                                                        </p>

                                                        <div className="mt-4 flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-gray-200 dark:border-obsidian-900 text-xs">
                                                            <div className="flex items-center gap-2">
                                                                <button
                                                                    onClick={() => playAudio(`https://verses.quran.com/Alafasy/mp3/${String(verse.verse_key.split(':')[0]).padStart(3, '0')}${String(verse.verse_key.split(':')[1]).padStart(3, '0')}.mp3`, `سورة ${selectedSurah?.name_arabic} - آية ${verse.verse_number}`)}
                                                                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-800 text-gold-300 font-semibold hover:bg-emerald-900 transition-colors"
                                                                >
                                                                    <i data-lucide="play" className="w-3.5 h-3.5 fill-gold-300"></i>
                                                                    <span>استماع</span>
                                                                </button>
                                                                <button
                                                                    onClick={() => fetchTafsir(verse.verse_key)}
                                                                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gold-500/10 text-gold-600 dark:text-gold-400 font-semibold border border-gold-500/30 hover:bg-gold-500/20 transition-colors"
                                                                >
                                                                    <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                                                                    <span>التفسير</span>
                                                                </button>
                                                            </div>

                                                            <div className="flex items-center gap-2">
                                                                <button
                                                                    onClick={() => toggleBookmark(verse.verse_key, selectedSurah?.name_arabic, verse.verse_number, verse.text_uthmani)}
                                                                    className={`p-2 rounded-lg border transition-colors ${isBookmarked ? 'bg-gold-500 text-emerald-950 border-gold-600' : 'bg-gray-100 dark:bg-obsidian-900 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-obsidian-950'}`}
                                                                    title="إشارة مرجعية"
                                                                >
                                                                    <i data-lucide="bookmark" className="w-4 h-4"></i>
                                                                </button>
                                                            </div>
                                                        </div>

                                                        {activeTafsirVerse === verse.verse_key && (
                                                            <div className="mt-4 p-5 rounded-2xl bg-white dark:bg-obsidian-900 border border-gold-500/40 text-right space-y-3 shadow-inner">
                                                                <div className="flex items-center justify-between font-bold text-gold-600 dark:text-gold-400 text-sm">
                                                                    <span>التفسير المعتمد</span>
                                                                    <button onClick={() => setActiveTafsirVerse(null)} className="text-xs text-gray-400 hover:text-gray-600">إغلاق</button>
                                                                </div>
                                                                {loadingTafsir ? (
                                                                    <p className="text-xs text-gray-400 animate-pulse">جاري جلب التفسير...</p>
                                                                ) : (
                                                                    <div className="text-sm leading-relaxed text-gray-700 dark:text-gray-200" dangerouslySetInnerHTML={{ __html: tafsirText }}></div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {currentTab === 'hifz' && (
                            <div className="space-y-8">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-emerald-900 to-emerald-950 text-white shadow-xl border border-gold-500/30 space-y-4">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold-500/20 text-gold-300 text-xs font-semibold">
                                        <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                        <span>نظام الحفظ الذكي</span>
                                    </div>
                                    <h2 className="text-3xl font-extrabold">متابعة حفظ القرآن الكريم والمراجعة</h2>
                                    <p className="text-emerald-100/80 text-sm">احفظ الآيات وتابع إشاراتك المرجعية لتنظيم وردك اليومي.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="p-6 rounded-2xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-md space-y-3">
                                        <h3 className="text-lg font-bold text-emerald-900 dark:text-gold-400 flex items-center gap-2">
                                            <i data-lucide="bookmark" className="w-5 h-5 text-gold-500"></i>
                                            <span>الآيات المحفوظة والمفضلة ({bookmarks.length})</span>
                                        </h3>
                                        {bookmarks.length === 0 ? (
                                            <p className="text-xs text-gray-500">لا توجد إشارات مرجعية مسجلة حتى الآن. اضغط على أيقونة الإشارة بجانب أي آية لإضافتها.</p>
                                        ) : (
                                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                                {bookmarks.map((b, i) => (
                                                    <div key={i} className="p-4 rounded-xl bg-gray-50 dark:bg-obsidian-950 border border-emerald-100 dark:border-emerald-900/50 space-y-1">
                                                        <div className="flex items-center justify-between text-xs text-gold-600 dark:text-gold-400 font-bold">
                                                            <span>سورة {b.surahName} - آية {b.verseNumber}</span>
                                                            <button onClick={() => setBookmarks(bookmarks.filter(item => item.verseKey !== b.verseKey))} className="text-red-500 hover:underline">حذف</button>
                                                        </div>
                                                        <p className="font-quran text-lg text-emerald-950 dark:text-ivory-50">{b.text}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-6 rounded-2xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-md space-y-4">
                                        <h3 className="text-lg font-bold text-emerald-900 dark:text-gold-400 flex items-center gap-2">
                                            <i data-lucide="target" className="w-5 h-5 text-gold-500"></i>
                                            <span>نصائح لحفظ القرآن الكريم</span>
                                        </h3>
                                        <ul className="space-y-3 text-sm text-gray-600 dark:text-gray-300 leading-relaxed list-disc list-inside">
                                            <li>التزم بمقدار ثابت يومياً (مثلاً 5 آيات بعد صلاة الفجر).</li>
                                            <li>كرر الآية الواحدة عدة مرات مع الاستماع للقارئ المفضل.</li>
                                            <li>اربط بين المعاني والتفسير لتسهيل الحفظ والاستيعاب.</li>
                                            <li>داوم على المراجعة الأسبوعية لتثبيت المحفوظات.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'adhkar' && (
                            <div className="space-y-8">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-emerald-900 to-emerald-950 text-white shadow-xl border border-gold-500/30 space-y-4">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold-500/20 text-gold-300 text-xs font-semibold">
                                        <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                        <span>حصن المسلم</span>
                                    </div>
                                    <h2 className="text-3xl font-extrabold">الأذكار اليومية والسبحة الإلكترونية</h2>
                                    <p className="text-emerald-100/80 text-sm">أذكار الصباح والمساء، التسبيح، ومعاني أسماء الله الحسنى.</p>
                                </div>

                                <div className="p-8 rounded-3xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-xl text-center space-y-6 max-w-md mx-auto">
                                    <h3 className="text-xl font-bold text-emerald-900 dark:text-gold-400">السبحة الإلكترونية المباركة</h3>
                                    <div
                                        onClick={() => setTasbihCount(tasbihCount + 1)}
                                        className="w-44 h-44 mx-auto rounded-full bg-gradient-to-br from-emerald-800 to-emerald-950 text-gold-400 flex flex-col items-center justify-center shadow-2xl border-4 border-gold-500/40 cursor-pointer hover:scale-105 transition-transform"
                                    >
                                        <span className="text-5xl font-extrabold">{tasbihCount}</span>
                                        <span className="text-xs text-emerald-200 mt-2">اضغط للتسبيح</span>
                                    </div>
                                    <button
                                        onClick={() => setTasbihCount(0)}
                                        className="px-4 py-2 rounded-xl bg-gray-100 dark:bg-obsidian-950 text-xs font-semibold text-gray-600 dark:text-gray-300 hover:bg-red-50 hover:text-red-600 transition-colors"
                                    >
                                        إعادة العداد
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-2xl font-bold flex items-center gap-2">
                                        <i data-lucide="heart" className="w-6 h-6 text-gold-500"></i>
                                        <span>أسماء الله الحسنى المعطرة</span>
                                    </h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        {[
                                            { name: "اللَّهُ", meaning: "الاسم الأعظم الجامع لمعاني الألوهية" },
                                            { name: "الرَّحْمَٰنُ", meaning: "الواسع الرحمة بجميع المخلوقات" },
                                            { name: "الرَّحِيمُ", meaning: "المتفضل بالمرحمة الخاصة على المؤمنين" },
                                            { name: "الْمَلِكُ", meaning: "الحاكم الحقيقي ومالك الملك" },
                                            { name: "الْقُدُّوسُ", meaning: "المنزه عن كل نقص وعيب" },
                                            { name: "السَّلَامُ", meaning: "المسالم لخليقته، مصدر السلام والأمان" }
                                        ].map((item, idx) => (
                                            <div key={idx} className="p-6 rounded-2xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-md space-y-2">
                                                <h4 className="text-xl font-extrabold text-emerald-800 dark:text-gold-400">{item.name}</h4>
                                                <p className="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">{item.meaning}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'prayer' && (
                            <div className="space-y-8">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-emerald-900 to-emerald-950 text-white shadow-xl border border-gold-500/30 space-y-4">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold-500/20 text-gold-300 text-xs font-semibold">
                                        <i data-lucide="compass" className="w-3.5 h-3.5"></i>
                                        <span>مواقيت الصلاة واتجاه القبلة</span>
                                    </div>
                                    <h2 className="text-3xl font-extrabold">مواقيت الصلوات الخمس</h2>
                                    <p className="text-emerald-100/80 text-sm">مواعيد دقيقة للصلوات حسب الإحداثيات المحلية مع بوصلة القبلة.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="p-8 rounded-3xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-xl space-y-6">
                                        <div className="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-obsidian-950">
                                            <h3 className="text-lg font-bold flex items-center gap-2">
                                                <i data-lucide="clock" className="w-5 h-5 text-gold-500"></i>
                                                <span>مواقيت اليوم</span>
                                            </h3>
                                            <span className="text-xs px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-gold-400 font-semibold">مكة المكرمة</span>
                                        </div>
                                        <div className="space-y-3">
                                            {[
                                                { name: "الفجر", time: "05:05 ص" },
                                                { name: "الشروق", time: "06:30 ص" },
                                                { name: "الظهر", time: "12:15 م" },
                                                { name: "العصر", time: "03:20 م" },
                                                { name: "المغرب", time: "05:55 م" },
                                                { name: "العشاء", time: "07:15 م" }
                                            ].map((p, i) => (
                                                <div key={i} className="flex items-center justify-between p-4 rounded-xl bg-gray-50 dark:bg-obsidian-950 border border-gray-100 dark:border-obsidian-900 font-bold">
                                                    <span>{p.name}</span>
                                                    <span className="text-gold-600 dark:text-gold-400">{p.time}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="p-8 rounded-3xl bg-white dark:bg-obsidian-900 border border-emerald-100 dark:border-emerald-900 shadow-xl flex flex-col items-center justify-center text-center space-y-6">
                                        <div className="w-24 h-24 rounded-full bg-gradient-to-br from-emerald-800 to-emerald-950 text-gold-400 flex items-center justify-center shadow-lg border-2 border-gold-500">
                                            <i data-lucide="compass" className="w-12 h-12 animate-pulse"></i>
                                        </div>
                                        <div className="space-y-2">
                                            <h3 className="text-xl font-bold">اتجاه القبلة المشرفة</h3>
                                            <p className="text-xs text-gray-500 dark:text-gray-400 max-w-xs">تشير البوصلة تلقائياً نحو الكعبة المشرفة بناءً على موقعك الجغرافي.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Fixed Bottom Audio Player */}
                    {currentAudioUrl && (
                        <div className="fixed bottom-0 left-0 right-0 z-40 bg-emerald-950/95 text-white backdrop-blur-lg border-t border-gold-500/30 shadow-2xl p-4">
                            <audio
                                ref={audioRef}
                                src={currentAudioUrl}
                                onEnded={handleAudioEnded}
                            />
                            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                                <div className="flex items-center gap-3 truncate">
                                    <div className="w-10 h-10 rounded-lg bg-gold-500/20 border border-gold-500/40 flex items-center justify-center text-gold-400 shrink-0">
                                        <i data-lucide="volume-2" className="w-5 h-5"></i>
                                    </div>
                                    <div className="truncate">
                                        <h4 className="font-bold text-sm text-gold-300 truncate">{currentAudioTitle}</h4>
                                        <p className="text-xs text-emerald-200/70">التلاوة الصوتية مباركة {repeatCount > 1 ? `(تكرار ${currentRepeat}/${repeatCount})` : ''}</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-4">
                                    <button
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        className="w-12 h-12 rounded-full bg-gradient-to-r from-gold-500 to-gold-600 text-emerald-950 flex items-center justify-center shadow-lg hover:scale-105 transition-transform"
                                    >
                                        <i data-lucide={isPlaying ? "pause" : "play"} className="w-6 h-6 fill-emerald-950"></i>
                                    </button>
                                </div>

                                <div className="hidden md:flex items-center gap-4 text-xs">
                                    <div className="flex items-center gap-1.5 bg-emerald-900/60 px-3 py-1.5 rounded-lg border border-emerald-800">
                                        <i data-lucide="repeat" className="w-3.5 h-3.5 text-gold-400"></i>
                                        <span>التكرار:</span>
                                        <select
                                            value={repeatCount}
                                            onChange={e => setRepeatCount(Number(e.target.value))}
                                            className="bg-transparent text-gold-300 font-bold focus:outline-none cursor-pointer"
                                        >
                                            <option value={1} className="bg-emerald-950">بدون</option>
                                            <option value={3} className="bg-emerald-950">3 مرات</option>
                                            <option value={5} className="bg-emerald-950">5 مرات</option>
                                        </select>
                                    </div>

                                    <div className="flex items-center gap-1.5 bg-emerald-900/60 px-3 py-1.5 rounded-lg border border-emerald-800">
                                        <i data-lucide="gauge" className="w-3.5 h-3.5 text-gold-400"></i>
                                        <span>السرعة:</span>
                                        <select
                                            value={playbackRate}
                                            onChange={e => setPlaybackRate(Number(e.target.value))}
                                            className="bg-transparent text-gold-300 font-bold focus:outline-none cursor-pointer"
                                        >
                                            <option value={0.75} className="bg-emerald-950">0.75x</option>
                                            <option value={1} className="bg-emerald-950">1.0x</option>
                                            <option value={1.25} className="bg-emerald-950">1.25x</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
